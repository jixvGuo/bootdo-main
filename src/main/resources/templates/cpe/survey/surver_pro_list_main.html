    <script>
        var basic2 = true;
        var basic3 = true;
        var basic4 = true;
        var basic5 = true;
        var basic6 = true;
        var basic7 = true;
        var basic8 = true;

        function againload(e) {
            var Number = e.charAt(e.length - 1);

            if (Number == 2) {
                if (basic2) {
                    var src = $("#" + e + " iframe").attr("src");
                    $("#" + e + " iframe").attr("src", src);
                    basic2 = false;
                }
            } else if (Number == 3) {
                if (basic3) {
                    var src = $("#" + e + " iframe").attr("src");
                    $("#" + e + " iframe").attr("src", src);
                    basic3 = false;
                }
            }


        }

        /** 当前激活子 tab 内的项目列表 iframe（勘察/设计/软件/标准） */
        function getActiveSurverProListIframe() {
            var $pane = $(".tab-pane.active");
            if (!$pane.length) {
                $pane = $(".tab-pane").first();
            }
            return $pane.find("iframe").first();
        }

        /**
         * 供顶层 contabs 关闭「查看/形审」Tab 时调用。
         * 原：外层 toProListMain 无 reLoad，refreshActiveIframeIfPossible 调不到内层 surverProList。
         */
        function reLoad() {
            var $iframe = getActiveSurverProListIframe();
            if (!$iframe.length) {
                return;
            }
            try {
                var win = $iframe[0].contentWindow;
                if (win && typeof win.refreshSurverProListWithAnchor === "function") {
                    win.refreshSurverProListWithAnchor();
                } else if (win && typeof win.reLoad === "function") {
                    win.reLoad();
                }
            } catch (e) { /* ignore */ }
        }

        function refreshSurverProListWithAnchor() {
            reLoad();
        }
    </script>
