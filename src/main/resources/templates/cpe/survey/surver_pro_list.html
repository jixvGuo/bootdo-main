<script>

    function reloadData() {
        var applyPage = layer.open({
            type: 2,
            title: "勘察奖申报",
            maxmin: true,
            shadeClose: false, // 点击遮罩关闭层
            area: ['800px', '520px'],
            content: "/qcAward/view/apply" // iframe的url
        });

        layer.full(applyPage)
    }


	$('.ui.dropdown').dropdown();

	function isUpdateType(that, proId) {
		layer.confirm('确定要更新专业吗？', {
			btn: ['确定', '取消']
		}, function () {
			$.ajax({
				url: "/scienceProgressScience/updateProMajor",
				type: "post",
				data: {
					'id': proId,
					'major':$(that).val(),
					'proType':'science'
				},
				success: function (r) {
					if (r.code == 0) {
						layer.msg(r.msg);
						reLoad();
					} else {
						layer.msg(r.msg);
					}
				}
			});
		})
	}

</script>
