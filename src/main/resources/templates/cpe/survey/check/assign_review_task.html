<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<link href="/css/semantic/semantic.min.css" rel="stylesheet">

<body class="gray-bg">
<div class="ui container">
    <div class="ui attached segment">
        <form class="ui form">
            <input id="taskId" name="taskId" type="hidden" th:value="${taskId}">
            <input id="proIds" name="proIds" type="hidden">
            <input id="assignUrl" type="hidden" value="/cpe/suverProcess/assignPro">
            <input type="hidden" name="awardSubType" id="awardSubType" value="">

            <div class="ui two fields">
                <div class="ui field">
                    <label>分组</label>
                    <div class="ui selection dropdown" id="qcGroupMenu">
                        <input type="hidden" name="qcGroupName" id="qcGroupName" value="">
                        <i class="dropdown icon"></i>
                        <div class="default text">分组</div>
                        <div class="menu" id="groupMenu">
                            <div class="item" data-value="">全部分组</div>
                            <div class="item" data-value="__NO_GROUP__">未分组</div>
                        </div>
                    </div>
                </div>
                <div class="ui field">
                    <label>勘察奖协会外聘人员</label>
                    <div class="ui selection dropdown" id="asWorkerMenu">
                        <input type="hidden" name="asWorkerName" id="asWorkerName" value="">
                        <i class="dropdown icon"></i>
                        <div class="default text" id="outside_ass">协会外聘人员</div>
                        <div class="menu" id="externalMenu">
                            <div class='item' th:each="obj:${assWorkers}" th:data-value="${obj.username}" th:text="${obj.name}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="ui wide grid">
        <div class="seven wide column">
            <div class="ui red segment">
                <table class="ui selectable celled table">
                    <thead id="leftthead">
                    <tr>
                        <th>
                            <div class="ui fitted checkbox">
                                <input type="checkbox">
                                <label></label>
                            </div>
                        </th>
                        <th>编号</th>
                        <th>项目编号</th>
                        <th>名称</th>
                        <th>项目类别</th>
                        <th>企业名称</th>
                        <th>专业</th>
                        <th>分组</th>
                    </tr>
                    </thead>
                    <tbody id="lefttbody">
                    <tr th:each=" externalList: ${noAssignList}">
                        <td name="option">
                            <div class="ui fitted checkbox">
                                <input type="checkbox">
                                <label></label>
                            </div>
                        </td>
                        <td th:text="${externalList.id}"></td>
                        <td th:text="${externalList.proCode}"></td>
                        <td th:text="${externalList.taskName}"></td>
                        <td th:text="${externalList.proSubTypeStr}"></td>
                        <td th:text="${externalList.enterpriseName}"></td>
                        <td th:text="${externalList.major}"></td>
                        <td th:text="${externalList.qcGroupname}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="two wide column">
            <div class="ui red segment">
                <button class="ui fluid green basic button mini icon" onclick="leftbutton()"><i
                        class="angle double left icon"></i></button>
                <br>
                <br>
                <button class="ui fluid green basic button mini icon" onclick="rightbutton()"><i
                        class="angle double right icon"></i></button>
            </div>
        </div>
        <div class="seven wide column">
            <div class="ui red segment">
                <table class="ui selectable celled table">
                    <thead id="rightthead">
                    <tr>
                        <th>
                            <div class="ui fitted checkbox">
                                <input type="checkbox">
                                <label></label>
                            </div>
                        </th>
                        <th>编号</th>
                        <th>项目编号</th>
                        <th>名称</th>
                        <th>项目类别</th>
                        <th>企业名称</th>
                        <th>专业</th>
                        <th>分组</th>
                    </tr>


                    </thead>
                    <tbody id="righttbody">
                    <tr th:each=" externalList: ${assignList}">
                        <td name="option">
                            <div class="ui fitted checkbox">
                                <input type="checkbox">
                                <label></label>
                            </div>
                        </td>
                        <input type="hidden" name="proId" th:value="${externalList.id}" />
                        <td id="external" th:text="${externalList.serNum}"></td>
                        <td th:text="${externalList.proCode}"></td>
                        <td th:text="${externalList.taskName}"></td>
                        <td th:text="${externalList.proSubTypeStr}"></td>
                        <td th:text="${externalList.enterpriseName}"></td>
                        <td th:text="${externalList.major}"></td>
                        <td th:text="${externalList.qcGroupname}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="ui basic center aligned segment">
        <button class="ui button" type="submit" onclick="assignPro()">完成分配</button>
        <div class="ui modal">
            <div class="ui inverted segment">
                <h2 class="ui center aligned icon header">
                    <i class="check icon"></i>
                    <div class="content">成功</div>
                </h2>
            </div>
        </div>
    </div>
</div>
<input type="hidden" id="firstWorkerName" th:value="${firstWorkerName}"/>
<input type="hidden" id="selAwardType" value="surver_pro"/>
<div th:include="include::footer"></div>

<script type="text/javascript" src="/js/semantic/semantic.min.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qcCheckAssignment/qc_assign_pro.js?v=1.0"></script>

<script type="text/javascript">

    // 防止循环触发的标志位
    var isUpdating = false;

    // 页面不区分奖项，统一按勘察奖全量查询
    $("#awardSubType").val("");

    $('#qcGroupMenu').dropdown({
        onChange: (value, text, $choice) => {
            if (isUpdating) return;
            isUpdating = true;

            console.log("---->qcGroupMenu ",value, text, $choice);
            var asWorkerName = $("#asWorkerName").val();
            $.ajax({
                url:'/cpe/suverProcess/queryAssignPro',
                type: "POST",
                data:{
                    asWorkerName: asWorkerName,
                    awardType:'surver_pro',
                    qcGroupName: value,
                    taskId: $("#taskId").val()
                },
                success:function (data) {
                    console.log("==qcGroupMenu===>data=", data);
                    initSelContion(data.noAssignList, 'lefttbody', 'leftthead');
                    initSelContion(data.assignList, 'righttbody', 'rightthead');
                },
                complete: function() {
                    isUpdating = false;
                }
            });
        }
    });

    $('#asWorkerMenu').dropdown({
        onChange: (value, text, $choice) => {
            if (isUpdating) return;
            isUpdating = true;

            console.log("---->asWorkerMenu ",value, text, $choice);
            var qcGroupName = $("#qcGroupName").val();
            $.ajax({
                url:'/cpe/suverProcess/queryAssignPro',
                type: "POST",
                data:{
                    asWorkerName: value,
                    awardType:'surver_pro',
                    qcGroupName: qcGroupName,
                    taskId: $("#taskId").val()
                },
                success:function (data) {
                    console.log("==asWorkerMenu===>data=", data);
                    initSelContion(data.noAssignList, 'lefttbody', 'leftthead');
                    initSelContion(data.assignList, 'righttbody', 'rightthead');
                },
                complete: function() {
                    isUpdating = false;
                }
            });
        }
    });

    function initSelContion(proList, tbodyId, headId){
        var trStr = "";
        for (var i = 0; i < proList.length; i++) {
            var obj = proList[i];
            trStr += "<tr data-pro-id='" + obj.id + "'> " +
                "                        <td name=\"option\"> " +
                "                            <div class=\"ui fitted checkbox\"> " +
                "                                <input type=\"checkbox\"> " +
                "                                <label></label> " +
                "                            </div> " +
                "                        </td> " +
                "                        <td>" + obj.serNum + "</td> " +
                "                        <td>" + obj.proCode + "</td> " +
                "                        <td>" + obj.taskName + "</td> " +
                "                        <td>" + (obj.proSubTypeStr || '') + "</td> " +
                "                        <td>" + obj.enterpriseName + "</td> " +
                "                        <td>" + obj.major + "</td> " +
                "                        <td>" + (obj.qcGroupname || '') + "</td> " +
                "                    </tr>";
        }

        $("#" + tbodyId).html(trStr);

        $('#' + headId).click(function (e) {
            if ($(this).find("input").is(':checked')) {
                $('#lefttbody').find(".checkbox").checkbox('check');
            } else {
                $('#lefttbody').find(".checkbox").checkbox('uncheck');
            }
        });
    }

    // 加载分组列表（复用项目分组字段）
    function loadSurverGroups() {
        var taskId = $("#taskId").val();
        $.ajax({
            url:'/cpe/suverProcess/getSurverGroups',
            type: "POST",
            data:{
                taskId: taskId,
                awardType: 'surver_pro'
            },
            success:function (data) {
                var html = '<div class="item" data-value="">全部分组</div>' +
                    '<div class="item" data-value="__NO_GROUP__">未分组</div>';
                if(data && data.code === 0 && data.list){
                    for (var i = 0; i < data.list.length; i++) {
                        var g = data.list[i] || '';
                        html += '<div class="item" data-value="' + g + '">' + g + '</div>';
                    }
                }
                $("#groupMenu").html(html);
            }
        });
    }

    $("#externalMenu").parent().dropdown('set selected', $("#firstWorkerName").val());
    loadSurverGroups();

    $('#leftthead').click(function (e) {
        if ($(this).find("input").is(':checked')) {
            $('#lefttbody').find(".checkbox").checkbox('check');
        } else {
            $('#lefttbody').find(".checkbox").checkbox('uncheck');
        }
    });

    $('#rightthead').click(function (e) {
        if ($(this).find("input").is(':checked')) {
            $('#righttbody').find(".checkbox").checkbox('check');
        } else {
            $('#righttbody').find(".checkbox").checkbox('uncheck');
        }
    });

    $('tbody').click(function (e) {
        $(this).find('tr').each(function () {
            if ($(this).find("input").is(':checked')) {
                $(this).css("background-color", "#C0C0C0");
            } else {
                $(this).css("background-color", "");
            }
        });
    });

    function leftbutton() {
        $('#righttbody tr').each(function () {
            if ($(this).find("input").is(':checked')) {
                $('#lefttbody').append(
                    $(this)
                );
                $(this).find("input").removeAttr('checked');
                $(this).css("background-color", "");
            }
        });
    }

    function rightbutton() {
        $('#lefttbody tr').each(function () {
            if ($(this).find("input").is(':checked')) {
                $('#righttbody').append(
                    $(this)
                );
                $(this).find("input").removeAttr('checked');
                $(this).css("background-color", "");
            }
        });
    }

    function complete() {
        $('.ui.modal').modal('show');
        //$('.ui.field').addClass("disabled");
        $('button').addClass("disabled");
    }

</script>

</body>
</html>
