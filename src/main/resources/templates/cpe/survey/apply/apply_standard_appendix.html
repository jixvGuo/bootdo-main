<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:shiro="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .file-item { margin-bottom: 5px; padding: 3px; }
        .btn-xs { margin-right: 5px; }
        .ibox-content { padding: 20px; }
    </style>
</head>

<div th:include="include :: footer"></div>
<body class="gray-bg">
<input type="hidden" id="isReadonly" th:value="${readonly}">
<input type="hidden" id="proId" th:value="${proId}" />
<input type="hidden" th:value="${projectInfo.proStat}" id="proStat">
<input id="taskId" name="taskId" th:value="${taskId}"  type="hidden">

<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>优秀标准设计奖附件上传列表</h5>
                </div>
                <div class="ibox-content">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>序号</th>
                            <th>材料名称</th>
                            <th>已上传文件</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>申报表盖章扫描件</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'apply_table'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="apply_table" onclick="showUpload('apply_table','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('apply_table')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>2</td><td>标准设计图集和文字说明总结</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'standard_desc'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="standard_desc" onclick="showUpload('standard_desc','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('standard_desc')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>3</td><td>主管部门批准立项及出版的批文</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'publish_txt'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="publish_txt" onclick="showUpload('publish_txt','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('publish_txt')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>4</td><td>两个（含两个）以上用户（设计或施工单位）的使用证明</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'use_desc'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="use_desc" onclick="showUpload('use_desc','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('use_desc')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>5</td><td>经济效益证明</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'economics_cert'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="economics_cert" onclick="showUpload('economics_cert','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('economics_cert')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>6</td><td>获局级一、二等奖的奖励证书或文件</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'bureau_level_award'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="bureau_level_award" onclick="showUpload('bureau_level_award','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('bureau_level_award')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>7</td><td>上传附件目录</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'standard_upload_accessories_catalog'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="standard_upload_accessories_catalog" onclick="showUpload('standard_upload_accessories_catalog','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('standard_upload_accessories_catalog')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>8</td><td>表7 项目简介表（word版）</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'standard_project_profile_sheet'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="standard_project_profile_sheet" onclick="showUpload('standard_project_profile_sheet','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('standard_project_profile_sheet')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/layui.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qc/qc_enclosure_upload.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/common/pro_stat.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qc/qc_file_common.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/common/readonly.js"></script>
<script type="text/javascript">
    var proId = $("#proId").val();
    var taskId = $("#taskId").val();
    var isReadonly = $("#isReadonly").val() === "true" || $("#isReadonly").val() === "1";
    var proStat = $("#proStat").val();

    $(function() {
        layui.use(['upload', 'layer'], function() {
            window.upload = layui.upload;
            window.layer = layui.layer;
        });
        actionInReadonly();
    });

    function actionInReadonly() {
        if ($("#isReadonly").val() == 1) {
            $("a").each(function () {
                $(this).css("pointer-events", "all");
            });
        }
    }

    function deleteAllFiles(fileType) {
        var fileIds = [];
        var fileElements = [];
        $('div.file-box[data-file-type="' + fileType + '"]').each(function() {
            fileIds.push($(this).data('file-id'));
            fileElements.push(this);
        });
        layer.confirm('确定要删除该类型的所有文件吗？', {
            btn: ['确定', '取消']
        }, function () {
            if (fileIds.length > 0) {
                var deleteCount = 0;
                for (var i = 0; i < fileIds.length; i++) {
                    delUploadDoc(fileElements[i], fileIds[i], function() {
                        deleteCount++;
                        if (deleteCount === fileIds.length) {
                            setTimeout(function() {
                                layer.msg("删除完成", { icon: 1 });
                                window.location.reload();
                            }, 500);
                        }
                    });
                }
            } else {
                layer.msg("没有文件需要删除", { icon: 0 });
            }
        });
    }

    function delUploadDoc(that, id, callback) {
        $.ajax({
            cache: true,
            type: "POST",
            url: "/petroleumEngineering/removeQualityFile/desc",
            data: { id: id },
            async: false,
            error: function () {
                parent.layer.alert("Connection error");
            },
            success: function (data) {
                if (data.code == 0) {
                    $(that).remove();
                }
                if (callback) {
                    callback();
                }
            }
        });
    }

    function showUpload(fileType, cssType) {
        if (isReadonly) {
            layer.msg("只读状态禁止上传", {icon: 2});
            return;
        }
        parent.layer.open({
            type: 2,
            title: "上传",
            maxmin: true,
            shadeClose: false,
            area: ['600px', '400px'],
            content: prefix + '/to_uploadsmall?proId='+$("#proId").val()+'&fileType='+fileType,
            end: function() {
                window.location.reload();
            }
        });
    }
</script>
</body>
</html>
