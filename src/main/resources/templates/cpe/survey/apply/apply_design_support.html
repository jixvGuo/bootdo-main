<script src="/js/layui.js"></script><script type="text/javascript" src="/js/appjs/cpe/qc/qc_enclosure_upload.js"></script><script type="text/javascript" src="/js/appjs/cpe/common/pro_stat.js"></script><script type="text/javascript" src="/js/appjs/cpe/qc/qc_file_common.js"></script><script type="text/javascript" src="/js/appjs/cpe/common/readonly.js"></script>
<script type="text/javascript">var isReadonly=$("#isReadonly").val()==="true"||$("#isReadonly").val()==="1";$(function(){layui.use(['upload','layer'],function(){window.upload=layui.upload;window.layer=layui.layer;});});function deleteAllFiles(fileType){var fileIds=[],fileElements=[];$('div.file-box[data-file-type="'+fileType+'"]').each(function(){fileIds.push($(this).data('file-id'));fileElements.push(this);});layer.confirm('确定要删除该类型的所有文件吗？',{btn:['确定','取消']},function(){if(fileIds.length>0){var c=0;for(var i=0;i<fileIds.length;i++){delUploadDoc(fileElements[i],fileIds[i],function(){c++;if(c===fileIds.length){setTimeout(function(){layer.msg("删除完成",{icon:1});window.location.reload();},500);}});}}else{layer.msg("没有文件需要删除",{icon:0});}});}function delUploadDoc(that,id,callback){$.ajax({cache:true,type:"POST",url:"/petroleumEngineering/removeQualityFile/desc",data:{id:id},async:false,success:function(data){if(data.code==0){$(that).remove();}if(callback){callback();}},error:function(){parent.layer.alert("Connection error");}});}function showUpload(fileType){if(isReadonly){layer.msg("只读状态禁止上传",{icon:2});return;}parent.layer.open({type:2,title:"上传",maxmin:true,shadeClose:false,area:['600px','400px'],content:prefix+'/to_uploadsmall?proId='+$("#proId").val()+'&fileType='+fileType,end:function(){window.location.reload();}});}function toViewUploadDoc(fileName,url){parent.layer.open({type:2,title:fileName,maxmin:true,shadeClose:false,area:['800px','520px'],content:url});}</script>
