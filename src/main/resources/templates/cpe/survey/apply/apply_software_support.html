<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:shiro="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .file-item { margin-bottom: 5px; padding: 3px; }
        .btn-xs { margin-right: 5px; }
        .ibox-content { padding: 20px; }
    </style>
</head>
<div th:include="include :: footer"></div>
<body class="gray-bg">
<input type="hidden" id="isReadonly" th:value="${readonly}">
<input type="hidden" id="proId" th:value="${proId}" />
<input type="hidden" th:value="${projectInfo.proStat}" id="proStat">
<input id="taskId" name="taskId" th:value="${taskId}"  type="hidden">

<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>计算机软件奖证明材料上传列表</h5>
                </div>
                <div class="ibox-content">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr><th>序号</th><th>材料名称</th><th>已上传文件</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                        <tr><td>1</td><td>鉴定证书或测评证书</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'iden_cert'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="iden_cert" onclick="showUpload('iden_cert','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('iden_cert')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>2</td><td>用户报告（加盖用户单位公章）</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'user_report'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="user_report" onclick="showUpload('user_report','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('user_report')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>3</td><td>推广应用时间、范围、数量及经济效益证明</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'economics'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="economics" onclick="showUpload('economics','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('economics')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>4</td><td>获局级一、二等奖的奖励证书或文件</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'award_cert'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="award_cert" onclick="showUpload('award_cert','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('award_cert')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        <tr><td>5</td><td>申报一等奖需提供查新检索报告</td><td><div class="row"><div class="col-sm-12"><div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'first_reprot'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box"><a href="javascript:void(0)" th:onclick="'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'"><span th:text="${doc.fileName}"/></a></div></div></div></td><td><button class="btn btn-primary btn-xs" fileType="first_reprot" onclick="showUpload('first_reprot','b')"><i class="fa fa-upload"></i> 上传</button><button class="btn btn-danger btn-xs" onclick="deleteAllFiles('first_reprot')"><i class="fa fa-upload"></i> 删除</button></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/layui.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qc/qc_enclosure_upload.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/common/pro_stat.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qc/qc_file_common.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/common/readonly.js"></script>
<script type="text/javascript">
var proId = $("#proId").val();
var taskId = $("#taskId").val();
var isReadonly = $("#isReadonly").val() === "true" || $("#isReadonly").val() === "1";
var proStat = $("#proStat").val();
$(function(){layui.use(['upload','layer'],function(){window.upload=layui.upload;window.layer=layui.layer;});actionInReadonly();});
function actionInReadonly(){if($("#isReadonly").val()==1){$("a").each(function(){$(this).css("pointer-events","all");});}}
function deleteAllFiles(fileType){var fileIds=[];var fileElements=[];$('div.file-box[data-file-type="'+fileType+'"]').each(function(){fileIds.push($(this).data('file-id'));fileElements.push(this);});layer.confirm('确定要删除该类型的所有文件吗？',{btn:['确定','取消']},function(){if(fileIds.length>0){var deleteCount=0;for(var i=0;i<fileIds.length;i++){delUploadDoc(fileElements[i],fileIds[i],function(){deleteCount++;if(deleteCount===fileIds.length){setTimeout(function(){layer.msg("删除完成",{icon:1});window.location.reload();},500);}});}}else{layer.msg("没有文件需要删除",{icon:0});}});}
function delUploadDoc(that,id,callback){$.ajax({cache:true,type:"POST",url:"/petroleumEngineering/removeQualityFile/desc",data:{id:id},async:false,error:function(){parent.layer.alert("Connection error");},success:function(data){if(data.code==0){$(that).remove();}if(callback){callback();}}});}
function showUpload(fileType,cssType){if(isReadonly){layer.msg("只读状态禁止上传",{icon:2});return;}parent.layer.open({type:2,title:"上传",maxmin:true,shadeClose:false,area:['600px','400px'],content:prefix+'/to_uploadsmall?proId='+$("#proId").val()+'&fileType='+fileType,end:function(){window.location.reload();}});}
</script>
</body>
</html>
