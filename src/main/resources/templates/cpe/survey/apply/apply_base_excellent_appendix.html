<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:shiro="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .file-item { margin-bottom: 5px; padding: 3px; }
        .btn-xs { margin-right: 5px; }
        .ibox-content { padding: 20px; }
    </style>
</head>

<div th:include="include :: footer"></div>
<body class="gray-bg">
<input type="hidden" id="isReadonly" th:value="${readonly}">
<input type="hidden" id="proId" th:value="${proId}" />
<input type="hidden" th:value="${projectInfo.proStat}" id="proStat">
<input id="taskId" name="taskId" th:value="${taskId}"  type="hidden">

<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>优秀勘察奖附件上传列表</h5>
                </div>
                <div class="ibox-content">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>序号</th>
                            <th>材料名称</th>
                            <th>已上传文件</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>1</td>
                            <td>申报表盖章扫描件</td>
                            <td>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'excellent_scanned_copy'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box">
                                            <a href="javascript:void(0)" th:onclick= "'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'">
                                                <span th:text="${doc.fileName}"/>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" fileType="excellent_scanned_copy" onclick="showUpload('excellent_scanned_copy','b')">
                                    <i class="fa fa-upload"></i> 上传
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteAllFiles('excellent_scanned_copy')">
                                    <i class="fa fa-upload"></i> 删除
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>附件材料：应附完整的工程勘察成果报告书</td>
                            <td>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'excellent_accessory_material_report'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box">
                                            <a href="javascript:void(0)" th:onclick= "'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'">
                                                <span th:text="${doc.fileName}"/>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" fileType="excellent_accessory_material_report" onclick="showUpload('excellent_accessory_material_report','b')">
                                    <i class="fa fa-upload"></i> 上传
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteAllFiles('excellent_accessory_material_report')">
                                    <i class="fa fa-upload"></i> 删除
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>附件材料：必要的工程勘察图片和照片</td>
                            <td>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'excellent_accessory_material_pic'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box">
                                            <a href="javascript:void(0)" th:onclick= "'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'">
                                                <span th:text="${doc.fileName}"/>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" fileType="excellent_accessory_material_pic" onclick="showUpload('excellent_accessory_material_pic','b')">
                                    <i class="fa fa-upload"></i> 上传
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteAllFiles('excellent_accessory_material_pic')">
                                    <i class="fa fa-upload"></i> 删除
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>上传附件目录</td>
                            <td>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'excellent_upload_accessories_catalog'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box">
                                            <a href="javascript:void(0)" th:onclick= "'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'">
                                                <span th:text="${doc.fileName}"/>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" fileType="excellent_upload_accessories_catalog" onclick="showUpload('excellent_upload_accessories_catalog','b')">
                                    <i class="fa fa-upload"></i> 上传
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteAllFiles('excellent_upload_accessories_catalog')">
                                    <i class="fa fa-upload"></i> 删除
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>表 7 项目简介表（word 版）</td>
                            <td>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div th:each="doc:${docUploadDoList}" th:if="${doc.fileType} eq 'excellent_project_profile_sheet'" th:attr="data-file-type=${doc.fileType}, data-file-id=${doc.fileId}" class="file-box">
                                            <a href="javascript:void(0)" th:onclick= "'javascript:toViewUploadDoc(\''+${doc.fileName}+'\',\''+${doc.url}+'\')'">
                                                <span th:text="${doc.fileName}"/>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <button class="btn btn-primary btn-xs" fileType="excellent_project_profile_sheet" onclick="showUpload('excellent_project_profile_sheet','b')">
                                    <i class="fa fa-upload"></i> 上传
                                </button>
                                <button class="btn btn-danger btn-xs" onclick="deleteAllFiles('excellent_project_profile_sheet')">
                                    <i class="fa fa-upload"></i> 删除
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/layui.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qc/qc_enclosure_upload.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/common/pro_stat.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/qc/qc_file_common.js"></script>
<script type="text/javascript" src="/js/appjs/cpe/common/readonly.js"></script>
<script type="text/javascript">
    var proId = $("#proId").val();
    var taskId = $("#taskId").val();
    var isReadonly = $("#isReadonly").val() === "true" || $("#isReadonly").val() === "1";
    var proStat = $("#proStat").val();

    $(function() {
        layui.use(['upload', 'layer'], function() {
            window.upload = layui.upload;
            window.layer = layui.layer;
        });
        actionInReadonly()
    });

    function actionInReadonly() {
        if ($("#isReadonly").val() == 1) {
            $("a").each(function () {
                $(this).css("pointer-events", "all");
            });
        }
    }

    function deleteAllFiles(fileType) {
        var fileIds = [];
        var fileElements = [];
        $('div.file-box[data-file-type="' + fileType + '"]').each(function() {
            fileIds.push($(this).data('file-id'));
            fileElements.push(this);
        });
        console.log(fileIds);
        layer.confirm('确定要删除该类型的所有文件吗？', {
            btn: ['确定', '取消']
        }, function () {
            if (fileIds.length > 0) {
                var deleteCount = 0;
                for (var i = 0; i < fileIds.length; i++) {
                    delUploadDoc(fileElements[i], fileIds[i], function() {
                        deleteCount++;
                        if (deleteCount === fileIds.length) {
                            setTimeout(function() {
                                layer.msg("删除完成", { icon: 1 });
                                window.location.reload();
                            }, 500);
                        }
                    });
                }
            } else {
                layer.msg("没有文件需要删除", { icon: 0 });
            }
        });
    }

    function delUploadDoc(that, id, callback) {
        $.ajax({
            cache: true,
            type: "POST",
            url: "/petroleumEngineering/removeQualityFile/desc",
            data: {
                id: id
            },
            async: false,
            error: function (request) {
                parent.layer.alert("Connection error");
            },
            success: function (data) {
                if (data.code == 0) {
                    $(that).remove();
                }
                if (callback) {
                    callback();
                }
            }
        });
    }

    function showUpload(fileType, cssType) {
        console.log("触发上传：fileType=", fileType, "proId=", proId, "taskId=", taskId);

        if (isReadonly) {
            layer.msg("只读状态禁止上传", {icon: 2});
            return;
        }

        parent.layer.open({
            type: 2,
            title: "上传",
            maxmin: true,
            shadeClose: false,
            area: ['600px', '400px'],
            content: prefix + '/to_uploadsmall?proId='+$("#proId").val()+'&fileType='+fileType,
            end: function() {
                window.location.reload();
            }
        });
    }
</script>
</body>
</html>
