<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head th:include="include :: header_lu"></head>
<!--QC 奖专家评审打分页面-->
<body>
    <div class="ui container">
        <div class="ui bottom attached segment">
            <form action="" class="ui basic form" id="resultScoreForm">
                <input type="hidden" id="proId" name="proId" th:value="${proId}" />
                <input type="hidden" id="taskId" name="taskId" th:value="${taskId}" />
                <input type="hidden" id="expertUid" name="expertUid" th:value="${expertUid}" />
                <input type="hidden" id="topicType" th:value="${proInfo != null ? proInfo.topicType : ''}" />
                <input type="hidden" id="applyId" name="applyId" th:value="${proInfo != null ? proInfo.applyId : ''}" />

                <h4 class="ui red horizontal divider header">基本信息</h4>
                <div class="ui two fields">
<!--                    <div class="ui field">-->
<!--                        <label>项目编号</label>-->
<!--                        <input type="text" placeholder="项目编号" readonly="readonly"-->
<!--                               th:value="${proInfo != null ? proInfo.proCode : ''}" />-->
<!--                    </div>-->
                    <div class="ui field disabled">
                        <label>课题名称</label>
                        <input type="text" placeholder="课题名称" readonly="readonly"
                               th:value="${proInfo != null ? proInfo.topicName : ''}" />
                    </div>
                </div>
<!--                <div class="ui two fields">-->
<!--                    <div class="ui field">-->
<!--                        <label>小组名称</label>-->
<!--                        <input type="text" placeholder="小组名称" readonly="readonly"-->
<!--                               th:value="${proInfo != null ? proInfo.groupName : ''}" />-->
<!--                    </div>-->
<!--                    <div class="ui field">-->
<!--                        <label>单位名称</label>-->
<!--                        <input type="text" placeholder="单位名称" readonly="readonly"-->
<!--                               th:value="${proInfo != null ? proInfo.companyName : ''}" />-->
<!--                    </div>-->
<!--                </div>-->
<!--                <div class="ui two fields">-->
<!--                    <div class="ui field">-->
<!--                        <label>课题类型</label>-->
<!--                        <input type="text" placeholder="课题类型" readonly="readonly"-->
<!--                               th:value="${proInfo != null ? proInfo.topicType : ''}" />-->
<!--                    </div>-->
<!--                    <div class="ui field">-->
<!--                        <label>专业范围</label>-->
<!--                        <input type="text" placeholder="专业范围" readonly="readonly"-->
<!--                               th:value="${proInfo != null ? proInfo.professionalScope : ''}" />-->
<!--                    </div>-->
<!--                </div>-->

                <h4 class="ui red horizontal divider header">打分详情</h4>
                <div style="text-align: center;margin: 10px 0 20px 0;">成果形成过程评价</div>

                <div class="ui grid">
                    <div class="eight wide column">
                        <div class="ui field">
                            <label id="selSocreLabel">选题（<span id="selSocreMaxCell"></span>）：</label>
                            <input type="number" id="selSocre" name="selSocre" min="0" step="0.01" placeholder="请输入..." />
                        </div>
                        <div class="ui field">
                            <label>对策与实施（20）：</label>
                            <input type="number" id="strategyExecuteScore" name="strategyExecuteScore" min="0" max="20" step="0.01" placeholder="请输入..." />
                        </div>
                        <div class="ui field">
                            <label>成果报告（5）：</label>
                            <input type="number" id="reportScore" name="reportScore" min="0" max="5" step="0.01" placeholder="请输入..." />
                        </div>
                        <div class="ui field">
                            <label>特点（8.5）：</label>
                            <input type="number" id="characteristicScore" name="characteristicScore" min="0" max="8.5" step="0.01" placeholder="请输入..." />
                        </div>
                    </div>

                    <div class="eight wide column">
                        <div class="ui field innovate-only" style="display: none;">
                            <label>提出方案确定最佳方案（30）：</label>
                            <input type="number" id="bestPlanScore" name="bestPlanScore" min="0" max="30" step="0.01" placeholder="请输入..." />
                        </div>
                        <div class="ui field solve-only" style="display: none;">
                            <label>原因分析（30）：</label>
                            <input type="number" id="reasonScore" name="reasonScore" min="0" max="30" step="0.01" placeholder="请输入..." />
                        </div>
                        <div class="ui field">
                            <label id="effectScoreLabel">效果（<span id="effectScoreMaxCell"></span>）：</label>
                            <input type="number" id="effectScore" name="effectScore" min="0" step="0.01" placeholder="请输入..." />
                        </div>
                        <div class="ui field">
                            <label>持证情况（3.5）：</label>
                            <input type="number" id="certificateScore" name="certificateScore" min="0" max="3.5" step="0.01" placeholder="请输入..." />
                        </div>
                    </div>
                </div>

                <!-- 成果实际价值评价（创新型和问题解决型都显示） -->
                <div style="text-align: center;margin: 30px 0 20px 0;">成果实际价值评价</div>
                <div class="ui field">
                    <label>1.技术价值2.经济价值3.社会价值4.推广应用价值（共20分）</label>
                    <input type="number" id="practicalValueScore" name="practicalValueScore" min="0" max="20" step="0.01" placeholder="请输入..." />
                </div>

                <div class="ui field disabled">
                    <label>总分</label>
                    <input type="number" id="appraiseSum" name="appraiseSum" readonly="readonly" />
                </div>

                <div class="ui basic center aligned segment">
                    <div class="ui blue button" onclick="saveResultScore()">保存</div>
                </div>
            </form>
        </div>
    </div>

    <div th:include="include :: footer_lu"></div>

    <script>
        function isInnovateTopicType() {
            var t = ($('#topicType').val() || '').toString();
            return t.indexOf('创新') >= 0 || t === 'innovate';
        }

        function parseNum(val) {
            if (val === null || val === undefined || val === '') {
                return 0;
            }
            var n = Number(val);
            return isNaN(n) ? 0 : n;
        }

        function fixed2(n) {
            return (Math.round(n * 100) / 100).toFixed(2);
        }

        function refreshByTopicType() {
            var innovate = isInnovateTopicType();
            if (innovate) {
                $('.innovate-only').show();
                $('.solve-only').hide();
                $('#selSocre').attr('max', 18);
                $('#selSocreMaxCell').text('18');
                $('#effectScore').attr('max', 15);
                $('#effectScoreMaxCell').text('15');
            } else {
                $('.innovate-only').hide();
                $('.solve-only').show();
                $('#selSocre').attr('max', 13);
                $('#selSocreMaxCell').text('13');
                $('#effectScore').attr('max', 20);
                $('#effectScoreMaxCell').text('20');
            }
        }

        // 自动计算评审总分
        function calcTotal() {
            var innovate = isInnovateTopicType();
            var total = 0;
            total += parseNum($('#selSocre').val());
            total += innovate ? parseNum($('#bestPlanScore').val()) : parseNum($('#reasonScore').val());
            total += parseNum($('#strategyExecuteScore').val());
            total += parseNum($('#effectScore').val());
            total += parseNum($('#reportScore').val());
            total += parseNum($('#characteristicScore').val());
            total += parseNum($('#certificateScore').val());
            // 两种类型都包含实际价值评价20分
            total += parseNum($('#practicalValueScore').val());
            $('#appraiseSum').val(fixed2(total));
        }

        function loadResultScore() {
            var proId = $('#proId').val();
            var taskId = $('#taskId').val();
            if (!proId || !taskId) {
                return;
            }
            var innovate = isInnovateTopicType();
            var url = innovate ? '/qcScore/getInnovateResultScore' : '/qcScore/getSolveResultScore';
            $.ajax({
                type: 'GET',
                url: url,
                data: { proId: proId, taskId: taskId },
                success: function (r) {
                    if (!r || r.code != 0) {
                        return;
                    }
                    var s = r.score || {};
                    $('#selSocre').val(s.selSocre);
                    $('#bestPlanScore').val(s.bestPlanScore);
                    $('#reasonScore').val(s.reasonScore);
                    $('#strategyExecuteScore').val(s.strategyExecuteScore);
                    $('#effectScore').val(s.effectScore);
                    $('#reportScore').val(s.reportScore);
                    $('#characteristicScore').val(s.characteristicScore);
                    $('#appraiseSum').val(s.appraiseSum);

                    $('#certificateScore').val(s.certificateScore);
                    $('#practicalValueScore').val(s.practicalValueScore);

                    calcTotal();
                }
            });
        }

        /**
         * 验证单个分值是否在有效范围内
         * @param fieldId 字段ID
         * @param fieldName 字段名称（用于错误提示）
         * @param min 最小值
         * @param max 最大值
         * @param allowEmpty 是否允许空值
         * @returns {boolean} 是否有效
         */
        function validateScore(fieldId, fieldName, min, max, allowEmpty) {
            var val = $('#' + fieldId).val();

            // 如果允许空值且输入框为空，则验证通过
            if (allowEmpty && (val === null || val === undefined || val === '')) {
                return true;
            }

            // 格式校验：非数字字符串直接拒绝
            if (isNaN(Number(val))) {
                alert(fieldName + '的分值格式不正确，请输入数字');
                $('#' + fieldId).focus();
                return false;
            }

            var value = parseNum(val);
            if (value < min || value > max) {
                console.error('[验证失败]', fieldName, '- 范围:', min, '-', max, ', 当前值:', value);
                alert(fieldName + '的分值必须在 ' + min + ' 到 ' + max + ' 之间，当前值：' + value);
                $('#' + fieldId).focus();
                return false;
            }
            return true;
        }

        /**
         * 自动修正输入值到有效范围内
         * @param input jQuery输入框对象
         */
        function autoCorrectScore(input) {
            var min = parseFloat(input.attr('min')) || 0;
            var max = parseFloat(input.attr('max')) || 999;
            var label = input.closest('.ui.field').find('label').text() || '该字段';

            // type="number"输入字母时，浏览器将val()置为空但validity.valid为false
            var nativeInput = input[0];
            if (nativeInput && nativeInput.validity && !nativeInput.validity.valid) {
                alert(label + '格式不正确，请输入数字，已重置为0');
                input.val(0);
                return;
            }

            var raw = input.val();
            if (raw === null || raw === undefined || raw === '') return;

            if (isNaN(Number(raw))) {
                alert(label + '格式不正确，请输入数字，已重置为0');
                input.val(0);
                return;
            }

            var val = parseNum(raw);
            if (val < min) {
                alert(label + '不能小于' + min + '，已自动修正');
                input.val(min);
            } else if (val > max) {
                alert(label + '不能超过' + max + '分，已自动修正');
                input.val(max);
            }
        }

        function saveResultScore() {
            console.log('[保存评分] 开始保存...');

            var proId = $('#proId').val();
            var taskId = $('#taskId').val();
            if (!proId || !taskId) {
                alert('项目信息缺失，无法保存');
                console.error('[保存评分] 项目信息缺失 - proId:', proId, ', taskId:', taskId);
                return;
            }

            // 验证所有分值
            var innovate = isInnovateTopicType();
            var selSocreMax = innovate ? 18 : 13;
            var effectScoreMax = innovate ? 15 : 20;

            console.log('[保存评分] 开始验证分值 - 课题类型:', innovate ? '创新型' : '问题解决型');

            // 必填项和范围验证（允许空值，因为专家可能只保存部分分数）
            if (!validateScore('selSocre', '选题', 0, selSocreMax, true)) return;

            if (innovate) {
                if (!validateScore('bestPlanScore', '提出方案确定最佳方案', 0, 30, true)) return;
            } else {
                if (!validateScore('reasonScore', '原因分析', 0, 30, true)) return;
            }

            if (!validateScore('strategyExecuteScore', '对策与实施', 0, 20, true)) return;
            if (!validateScore('effectScore', '效果', 0, effectScoreMax, true)) return;
            if (!validateScore('reportScore', '成果报告', 0, 5, true)) return;
            // if (!validateScore('characteristicScore', '特点（3.5）', 0, 3.5, true)) return;
            if (!validateScore('characteristicScore', '特点（8.5）', 0, 8.5, true)) return;
            if (!validateScore('certificateScore', '持证情况（3.5）', 0, 3.5, true)) return;
            if (!validateScore('practicalValueScore', '成果实际价值评价', 0, 20, true)) return;

            console.log('[保存评分] 验证通过，准备提交数据');

            calcTotal();
            // innovate变量已在上面声明，这里不需要重复声明
            var url = innovate ? '/qcScore/saveInnovateResultScore' : '/qcScore/saveSolveResultScore';

            console.log('[保存评分] 课题类型:', innovate ? '创新型' : '问题解决型', ', URL:', url);
            var data = {
                proId: proId,
                taskId: taskId,
                applyId: $('#applyId').val(),
                selSocre: $('#selSocre').val(),
                bestPlanScore: $('#bestPlanScore').val(),
                strategyExecuteScore: $('#strategyExecuteScore').val(),
                effectScore: $('#effectScore').val(),
                reportScore: $('#reportScore').val(),
                characteristicScore: $('#characteristicScore').val(),
                appraiseSum: $('#appraiseSum').val(),

                certificateScore: $('#certificateScore').val(),
                practicalValueScore: $('#practicalValueScore').val()
            };

            if (!innovate) {
                data.reasonScore = $('#reasonScore').val();
            }
            console.log('[保存评分] 发送Ajax请求 - data:', data);
            
            $.ajax({
                url: url,
                type: 'POST',
                data: data,
                beforeSend: function() {
                    console.log('[保存评分] 请求已发送...');
                },
                success: function (r) {
                    console.log('[保存评分] 收到响应:', r);
                    if (r && r.code == 0) {
                        alert('保存成功！');
                        
                        // 关闭弹窗并刷新父页面列表
                        try {
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(index);
                            // 刷新父页面的表格
                            if (parent.reLoad && typeof parent.reLoad === 'function') {
                                parent.reLoad();
                            }
                        } catch (e) {
                            console.warn('[保存评分] 关闭弹窗失败，可能不在弹窗中:', e);
                            // 如果不在弹窗中，只刷新当前页面
                            loadResultScore();
                        }
                    } else {
                        var errorMsg = r && r.msg ? r.msg : '保存失败';
                        console.error('[保存评分] 保存失败:', errorMsg);
                        alert('保存失败: ' + errorMsg);
                    }
                },
                error: function (xhr, status, error) {
                    console.error('[保存评分] Ajax请求失败 - status:', status, ', error:', error, ', xhr:', xhr);
                    alert('请求失败: ' + (error || status));
                }
            });
        }

        $(function () {
            refreshByTopicType();
            loadResultScore();
            
            // 输入时计算总分
            $('#resultScoreForm').on('keyup change', "input[type='number']", function () {
                calcTotal();
            });
            
            // 失焦时自动修正超出范围的值
            $('#resultScoreForm').on('blur', "input[type='number']:not([readonly])", function () {
                autoCorrectScore($(this));
                calcTotal();
            });
        });
    </script>
</body>

</html>
