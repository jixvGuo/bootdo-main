    // 新代码（v4）：先检查专家是否有淘汰数据，弹窗二次确认后再软删除
    function remove(a) {
        let loginAccount = $.trim($("#accountId" + a).text());
        let taskId = $("#taskId").val();
        if (!loginAccount) {
            layer.msg('账号为空', {icon: 2});
            return;
        }
        // 先检查是否有淘汰数据
        $.ajax({
            type: "GET",
            url: "/qcProcess/expert/checkData",
            data: {loginAccount: loginAccount, taskId: taskId},
            success: function (checkResult) {
                var confirmMsg = "确定要移出专家 [" + loginAccount + "] 吗？";
                if (checkResult.code == 0 && checkResult.hasEliminate) {
                    confirmMsg = "该专家已有淘汰数据（" + (checkResult.elimCount || 0) + "条淘汰, " + (checkResult.confirmedCount || 0) + "条已确认快照），确定要移出吗？\n移出后数据保留，可通过重新添加恢复。";
                }
                layer.confirm(confirmMsg, {icon: 3, title: '移出确认'}, function (index) {
                    layer.close(index);
                    doRemoveExpert(a, loginAccount);
                });
            },
            error: function () {
                // 检查接口失败，仍允许移出但给基础确认
                layer.confirm("确定要移出专家 [" + loginAccount + "] 吗？", {
                    icon: 3,
                    title: '移出确认'
                }, function (index) {
                    layer.close(index);
                    doRemoveExpert(a, loginAccount);
                });
            }
        });
    }

    // 执行移出操作（软删除）
    function doRemoveExpert(a, loginAccount) {
        $.ajax({
            cache: true,
            url: "/qcProcess/expert/remove",
            type: 'POST',
            data: {loginAccount: loginAccount},
            async: false,
            error: function (request) {
                parent.layer.alert("Connection error");
            },
            success: function (data) {
                if (data.code == 0) {
                    parent.layer.msg("操作成功（逻辑删除，数据已保留）");
                    $("#tr_" + a).remove();
                    $("td[name = 'trNum']").each(function (index, e) {
                        $(this).html(index + 1);
                    })
                } else {
                    parent.layer.alert(data.msg)
                }
            }
        })
    }

    /***
     * 删除某个条目
     * @param a
     */
    function onAddSign(a) {

        let taskId = $("#taskId").val();
        // 原代码：.html()可能包含尾部空格
        // var loginAccount = $("#accountId" + a).html();
        // 新代码：使用.text().trim()
        var loginAccount = $.trim($("#accountId" + a).text());
        let saveBtnHtml = $("#saveBtn_" + a).html();

        if (saveBtnHtml != "保存") {
            toUploadSignImg(taskId, loginAccount, a);
            return;
        }

        save(a, function () {
            toUploadSignImg(taskId, loginAccount, a);
        });

    }

    function toUploadSignImg(taskId, loginAccount, a) {
        layer.open({
            title: '上传转件签名 ',
            maxmin: true,
            type: 2,
            shadeClose: false, // 点击遮罩关闭层
            area: ['800px', '520px'],
            // content: '/scienceProgressScience/toUploadExpertSign?taskId='+taskId+'&loginAccount=' + loginAccount+"&trIndex="+a
            content: '/qcProcess/toUploadExpertSign?taskId=' + taskId + '&loginAccount=' + loginAccount + "&trIndex=" + a
        });
    }


    /***
     * 保存专家名字
     * @param a
     */
    function save(a, callback) {
        var fd = {
            // 原代码：.html()可能包含尾部空格导致用户名带空格入库
            // "username": $("#accountId" + a).html(),
            // 新代码：使用.text().trim()确保用户名无多余空格
            "username": $.trim($("#accountId" + a).text()),
            "password": "123456",
            "name": $("#accountName" + a).val(),
            "bankCard": $("#accountBank" + a).val(),
            "mobile": $("#accountPhone" + a).val(),
            "roleIds": "85",  // 新代码：使用QC奖评审专家角色
            "status": "1",
            "accountCom": $("#accountCom" + a).val()
        };
        // console.log("保存专家数据" + JSON.stringify(fd) + fd);
        $.ajax({
            cache: true,
            url: "/sys/user/savepro",
            type: 'POST',
            data: fd,
            async: false,
            error: function (request) {
                // layui 框架
                parent.layer.alert("Connection error");
            },
            success: function (data) {
                if (data.code == 0) {
                    // parent.layer.msg("操作成功");
                    // console.log(data.msg + "userid");
                    // 原代码：.get(0)返回DOM元素而非jQuery对象，调用.find()会报TypeError崩溃，导致saveExpertInfo永远不会被调用
                    // var isLeader = a == $("#list").find("tr").get(0).find("td").get(2).html();
                    // 新代码：使用jQuery的.eq()方法代替.get()，并增加异常保护
                    var isLeader = false;
                    var majorName = $("#majorName" + a).val();
                    try {
                        var leaderVal = $("#isGroupLeader" + a).val();
                        isLeader = ('' + leaderVal) === '1';
                    } catch (e) {
                        console.log('判断isLeader异常:', e);
                        isLeader = false;
                    }
                    saveExpertInfo(data.msg, isLeader, majorName, fd, a, callback);

                } else {
                    parent.layer.alert(data.msg)
                }
            }
        })
    }

    /***
     * 保存对应的专业信息/专业组
     * @param uid
     */
    function saveExpertInfo(uid, isLeader, majorName, userFd, trIndex, callback) {
        // console.log("== this.selfProfession =" + uid);
        var proType = $("#proType").val();  //获取选中的项
        var fd = {
            "userName": majorName,
            "taskId": $("#taskId").val(),
            "userId": uid,
            "proId": "0",
            "isGroupLeader": isLeader ? 1 : 0,
            "groupName": majorName,
            "company": userFd.accountCom,
            "bankAccount": userFd.bankCard,
            "phone": userFd.mobile,
            "expertName": userFd.name,
            "loginAccount": userFd.username,
            "proType": proType
        };
        console.log("===" + JSON.stringify(fd));

        $.ajax({
            cache: true,
            url: "/qcProcess/expert/add",

    /**
     * 渲染回避表格
     */
    function renderAvoidanceTable(projects) {
        var tbody = $("#avoidanceTableBody");
        tbody.empty();

        if (!projects || projects.length === 0) {
            tbody.html('<tr><td colspan="7" class="text-center">暂无分配项目</td></tr>');
            return;
        }

        projects.forEach(function (project) {
            var statusText = getProStatText(project.proStat);
            var isAvoided = project.isAvoided || false;
            var avoidanceStatus = isAvoided ? '<span class="label label-warning">已回避</span>' : '<span class="label label-success">正常</span>';

            var operationBtn = '';
            if (isAvoided) {
                operationBtn = '<button class="btn btn-sm btn-success" onclick="cancelAvoidance(' + project.proId + ')">取消回避</button>';
            } else {
                operationBtn = '<button class="btn btn-sm btn-warning" onclick="setAvoidance(' + project.proId + ')">设为回避</button>';
            }

            var row = '<tr>' +
                '<td>' + (project.topicName || '-') + '</td>' +
                '<td>' + (project.applyId || '-') + '</td>' +
                '<td>' + (project.unitName || '-') + '</td>' +
                '<td>' + (project.groupDesc || '-') + '</td>' +
                '<td>' + statusText + '</td>' +
                '<td>' + avoidanceStatus + '</td>' +
                '<td>' + operationBtn + '</td>' +
                '</tr>';
            tbody.append(row);
        });
    }

    /**

        var statMap = {
            '': '未提交',
            'check': '审核中',
            'partake_award': '参评',
            'no_award': '不评',
            'delayed_award': '缓评',
            'reject': '已驳回',
            'improve_partake': '完善后参评',
            'eliminated': '已淘汰',
            'to_validate': '审核中',
            'to_assign_experts': '分派专家',
            'experts_score': '专家打分',
            'score': '专家打分'
        };
        return statMap[proStat] || proStat || '-';
    }

    /**
     * 应用筛选条件
     */
    function applyAvoidanceFilters() {
        var filterTopicName = $("#avoidance_filter_topicName").val().toLowerCase();
        var filterProCode = $("#avoidance_filter_proCode").val().toLowerCase();
        var filterUnitName = $("#avoidance_filter_unitName").val().toLowerCase();
        var filterGroupDesc = $("#avoidance_filter_groupDesc").val().toLowerCase();
        var filterStatus = $("#avoidance_filter_status").val();

        var filteredProjects = allAvoidanceProjects.filter(function (project) {
            // 项目名称筛选
            if (filterTopicName && (!project.topicName || project.topicName.toLowerCase().indexOf(filterTopicName) === -1)) {
                return false;
            }

            // 申报账号筛选
            if (filterProCode && (!project.applyId || project.applyId.toLowerCase().indexOf(filterProCode) === -1)) {
                return false;
            }

            // 申报单位筛选
            if (filterUnitName && (!project.unitName || project.unitName.toLowerCase().indexOf(filterUnitName) === -1)) {
                return false;
            }

            // 完成单位筛选
            if (filterGroupDesc && (!project.groupDesc || project.groupDesc.toLowerCase().indexOf(filterGroupDesc) === -1)) {
                return false;
            }

            // 回避状态筛选
            if (filterStatus !== "") {
                var isAvoided = project.isAvoided || false;
                if (filterStatus === "1" && !isAvoided) {
                    return false;
                }
                if (filterStatus === "0" && isAvoided) {
                    return false;
                }
            }

            return true;
        });

        renderAvoidanceTable(filteredProjects);
    }

    function exportGroupEliminatedExcel() {
        if (!groupEliminatedData || groupEliminatedData.length === 0) {
            layer.msg('暂无数据可导出', {icon: 2});
            return;
        }

        function doExport() {
            var header = ['序号', '申报账号', '课题名称', '小组名称', '申报单位', '专家名称', '淘汰意见'];
            var sheetData = [header];
            groupEliminatedData.forEach(function (item, index) {
                sheetData.push([
                    index + 1,
                    item.proCode || '',
                    item.topicName || '',
                    item.groupName || '',
                    item.companyName || '',
                    item.expertName || '',
                    item.reason || ''
                ]);
            });
            var ws = XLSX.utils.aoa_to_sheet(sheetData);
            ws['!cols'] = [
                {wch: 6}, {wch: 18}, {wch: 30}, {wch: 20},
                {wch: 25}, {wch: 12}, {wch: 40}
            ];
            var wb = XLSX.utils.book_new();
            var sheetName = currentGroupName ? (currentGroupName + '_淘汰名单') : '淘汰名单';
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            XLSX.writeFile(wb, sheetName + '.xlsx');
        }

        if (typeof XLSX !== 'undefined') {
            doExport();
        } else {
            var s = document.createElement('script');
            s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
            s.onload = function () {
                doExport();
            };
            s.onerror = function () {
                layer.msg('Excel库加载失败，请检查网络', {icon: 2});
            };
            document.head.appendChild(s);
        }
    }

    /**
     * 为专家维度 sheet 批量施加边框 + 表头颜色
     * solveColEnd: 成果过程评分末列(含)  valueCol: 成果实际价值评价列
     */
    function _applyExpertSheetStyles(ws, solveColStart, solveColEnd, valueCol) {
        if (!ws['!ref']) return;
        var range = XLSX.utils.decode_range(ws['!ref']);
        var thin = {style: 'thin', color: {rgb: '000000'}};
        var border = {top: thin, bottom: thin, left: thin, right: thin};
        var fixFill = {patternType: 'solid', fgColor: {rgb: 'D9E1F2'}}; // 蓝灰：序号/申报号等固定列
        var solveFill = {patternType: 'solid', fgColor: {rgb: 'FCE4D6'}}; // 浅橙：成果过程评分
        var valueFill = {patternType: 'solid', fgColor: {rgb: 'FFF2CC'}}; // 浅黄：成果实际价值
        var tailFill = {patternType: 'solid', fgColor: {rgb: 'E2EFDA'}}; // 浅绿：资料分/完成单位等
        var titleFont = {bold: true, sz: 11};
        var headerFont = {bold: true, sz: 9};
        var center = {horizontal: 'center', vertical: 'center', wrapText: true};
        for (var R = range.s.r; R <= range.e.r; R++) {
            for (var C = range.s.c; C <= range.e.c; C++) {
                var addr = XLSX.utils.encode_cell({r: R, c: C});
                if (!ws[addr]) ws[addr] = {v: '', t: 's'};
                var s = {};
                s.border = border;
                s.alignment = center;
                if (R === 0) {
                    s.font = titleFont;
                } else if (R === 1 || R === 2) {
                    s.font = headerFont;
                    if (C < solveColStart) s.fill = fixFill;
                    else if (C <= solveColEnd) s.fill = solveFill;
                    else if (valueCol != null && C === valueCol) s.fill = valueFill;
                    else s.fill = tailFill;
                }
                ws[addr].s = s;
            }
        }
    }

    /**
     * 导出专家打分情况为Excel（问题解决型和创新型分两个sheet）
     */
    function exportExpertScoresToExcel(scores, expertName, groupName, signUrl) {
        var doExport = function () {
            var now = new Date();
            var year = now.getFullYear();
            var timeStr = year + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 '
                + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            var solveItems = (scores || []).filter(function (s) {
                return s.topicType === '问题解决型';
            });
            var innovateItems = (scores || []).filter(function (s) {
                return s.topicType === '创新型';
            });
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, _buildSolveSheet(solveItems, groupName, year, timeStr, signUrl), '问题解决型');
            XLSX.utils.book_append_sheet(wb, _buildInnovateSheet(innovateItems, groupName, year, timeStr, signUrl), '创新型');
            var safeFileName = (expertName || '专家').replace(/[\/\\:*?"<>|]/g, '_');
            XLSX.writeFile(wb, safeFileName + '_打分情况.xlsx');
        };
        if (typeof XLSX !== 'undefined') {
            doExport();
        } else {
            var s = document.createElement('script');
            s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
            s.onload = function () {
                doExport();
            };
            s.onerror = function () {
                layer.msg('Excel库加载失败，请检查网络', {icon: 2});
            };
            document.head.appendChild(s);
        }
    }

    /**
     * HTML转义工具函数
     */
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

        });
    }

    function _renderExpertBindingModal(experts, taskId) {
        var groups = _getQcGroupNames();
        var html = '<div style="padding:10px;min-width:600px;">';
        html += '<p style="color:#888;margin-bottom:12px;">为每位形审专家选择可查看的专业组（不选则不限制）</p>';
        if (!experts || experts.length == 0) {
            html += '<p style="color:#999;">暂无形审专家账号（角色72）</p>';
        } else {
            html += '<table class="table table-bordered table-striped" style="margin-bottom:0;">';
            html += '<thead><tr><th style="width:80px;">姓名</th><th style="width:120px;">账号</th><th>绑定专业组（多选）</th><th style="width:70px;">操作</th></tr></thead><tbody>';
            for (var i = 0; i < experts.length; i++) {
                var e = experts[i];
                var rowId = 'expert_' + e.userId;
                html += '<tr>';
                html += '<td>' + escapeHtml(e.name || '-') + '</td>';
                html += '<td>' + escapeHtml(e.username || '-') + '</td>';
                html += '<td style="padding:6px 8px;">';
                for (var j = 0; j < groups.length; j++) {
                    var g = groups[j];
                    var chkId = 'chk_' + e.userId + '_' + j;
                    var checked = (e.boundGroups && e.boundGroups.indexOf(g) >= 0) ? 'checked' : '';
                    html += '<label style="margin-right:12px;font-weight:normal;">';
                    html += '<input type="checkbox" id="' + chkId + '" class="expert-grp-chk" data-uid="' + e.userId + '" value="' + escapeHtml(g) + '" ' + checked + '> ' + escapeHtml(g);
                    html += '</label>';
                }
                if (groups.length == 0) {
                    html += '<span style="color:#999;">（无专业组，请先添加专家）</span>';
                }
                html += '</td>';
                html += '<td><button class="btn btn-primary btn-xs" onclick="_saveExpertBinding(\'' + e.userId + '\', \'' + taskId + '\')">保存</button></td>';
                html += '</tr>';
            }
            html += '</tbody></table>';
        }
        html += '</div>';
        layer.open({
            type: 1,
            title: '形审专家分组绑定',
            area: ['800px', '500px'],
            content: html,
            btn: ['关闭']
        });
    }

    function _saveExpertBinding(expertUserId, taskId) {
        var checked = [];
        $('input.expert-grp-chk[data-uid="' + expertUserId + '"]:checked').each(function () {
            checked.push($(this).val());
        });
        var groupNames = checked.join(',');
        $.ajax({
            type: 'POST', url: '/qcProcess/saveExpertGroupBinding',
            data: {taskId: taskId, expertUserId: expertUserId, groupNames: groupNames},
            success: function (data) {
                if (data.code == 0) {
                    layer.msg('绑定保存成功', {icon: 1});
                } else {
                    layer.msg(data.msg || '保存失败', {icon: 2});
                }
            },
            error: function () {
                layer.msg('保存失败，请稍后重试', {icon: 2});
            }
        });
    }
</script>

</body>
</html>
