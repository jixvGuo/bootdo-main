            <form action="" class="ui basic form" id="opinionForm">
                <input type="hidden" id="proId" name="proId" th:value="${proId}" />
                <input type="hidden" id="taskId" name="taskId" th:value="${taskId}" />

                        <label>项目编号</label>

                               th:value="${proInfo != null ? proInfo.proCode : ''}" />
                    </div>
                    <div class="ui field">
                        <label>课题名称</label>
                        <input type="text" name="topicname" placeholder="课题名称" readonly="readonly"
                               th:value="${proInfo != null ? proInfo.topicName : ''}" />
                    </div>
                </div>
                <div class="ui two fields">
                    <div class="ui field">
                        <label>小组名称</label>
                        <input type="text" name="groupname" placeholder="小组名称" readonly="readonly"
                               th:value="${proInfo != null ? proInfo.groupName : ''}" />
                    </div>
                    <div class="ui field">
                        <label>单位名称</label>
                        <input type="text" name="companyname" placeholder="单位名称" readonly="readonly"
                               th:value="${proInfo != null ? proInfo.companyName : ''}" />
                    </div>
                </div>
                <div class="ui two fields">
                    <div class="ui field">
                        <label>课题类型</label>
                        <input type="text" name="grouptype" placeholder="课题类型" readonly="readonly"
                               th:value="${proInfo != null ? proInfo.topicType : ''}" />
                    </div>
                    <div class="ui field">
                        <label>专业范围</label>
                        <input type="text" name="majorrange" placeholder="专业范围" readonly="readonly"
                               th:value="${proInfo != null ? proInfo.professionalScope : ''}" />
                    </div>
                </div>

                <h4 class="ui red horizontal divider header">评审意见</h4>
                <div class="ui field">
                    <textarea id="opinion" name="opinion"
                              th:text="${scoreInfo != null ? scoreInfo.sumRecommend : ''}"></textarea>
                </div>
                <div class="ui error message"></div>
                <div class="ui basic center aligned segment">
                    <div class="ui blue button" onclick="saveOpinion()">保存</div>
                </div>
            </form>
        </div>
    </div>

        function saveOpinion() {
            var proId = $("#proId").val();
            var taskId = $("#taskId").val();
            if (!proId || !taskId) {
                layer.msg("项目信息缺失，无法保存");
                return;
            }

            var opinionContent = opinionEditor.getValue();
            if (!opinionContent || opinionContent.trim() === '') {
                layer.msg("请填写评审意见");
                return;
            }

            var data = {
                proId: proId,
                taskId: taskId,
                sumRecommend: opinionContent
            };

            $.ajax({
                url: "/qcScore/saveScore",
                type: "POST",
                data: data,
                success: function (r) {
                    if (r.code == 0) {
                        layer.msg("保存成功");
                    } else {
                        layer.msg(r.msg);
                    }
                },
                error: function () {
                    layer.msg("请求失败");
                }
            });
        }
