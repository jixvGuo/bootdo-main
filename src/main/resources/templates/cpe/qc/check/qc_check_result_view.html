<!DOCTYPE html>
<!-- 新增：QC奖专家查看形式审查结果页面（只读） -->
<!-- 参考科技奖 viewCheckResult 功能，专家可查看项目的形审结论和评语 -->
<html xmlns:th="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>QC奖形式审查结果</h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">项目编号：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" th:value="${qcProData.proCode}" readonly />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">课题名称：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" th:value="${qcProData.topicName}" readonly />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">小组名称：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" th:value="${qcProData.groupName}" readonly />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">申报单位：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" th:value="${qcProData.companyName}" readonly />
                            </div>
                        </div>

                        <div class="hr-line-dashed"></div>

                        <div class="form-group">
                            <label class="col-sm-3 control-label">审查结论：</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control"
                                       th:value="${reviewResult.reviewResult}" readonly
                                       th:style="${reviewResult.reviewResult == '参评' ? 'color:green;font-weight:bold' :
                                                   (reviewResult.reviewResult == '不评' ? 'color:red;font-weight:bold' : 'font-weight:bold')}" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">审查意见：</label>
                            <div class="col-sm-8">
                                <textarea class="form-control" rows="5" readonly
                                          th:text="${reviewResult.opinionDesc}"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
</body>
</html>
