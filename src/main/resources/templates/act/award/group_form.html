<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="groupForm">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">任务 ID：</label>
                            <div class="col-sm-8">
                                <input id="taskid" name="taskid" class="form-control" type="hidden" th:value="${taskId}">
                                <input id="groupid" name="groupid" class="form-control" type="hidden" th:value="${group != null ? group.groupid : ''}">
                                <input id="taskIdDisplay" name="taskIdDisplay" class="form-control" type="text" readonly="readonly" th:value="${taskId}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">分组名称：</label>
                            <div class="col-sm-8">
                                <input id="name" name="name" class="form-control" type="text" required th:value="${group != null ? group.name : ''}">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary">保存</button>
                                <button type="button" class="btn btn-default" onclick="parent.layer.closeAll()">取消</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/js/appjs/act/award/group_form.js"></script>
</body>
</html>
